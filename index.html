<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive in the Arctic for 3 Weeks!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; cursor: crosshair; }
        canvas { display: block; }
        #blocker {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 10, 20, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: #cde;
            font-family: 'Courier New', monospace;
        }
        #blocker h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #acd;
            text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
        }
        #blocker p {
            font-size: 16px;
            margin-bottom: 8px;
            color: #8ab;
        }
        #blocker .click-msg {
            font-size: 20px;
            margin-top: 30px;
            color: #fff;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            z-index: 50;
            pointer-events: none;
            display: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
        }
        #crosshair::before {
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 2px; height: 100%;
        }
        #crosshair::after {
            top: 50%; left: 0;
            transform: translateY(-50%);
            width: 100%; height: 2px;
        }
        #day-display {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #cde;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            z-index: 50;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            display: none;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1>Survive in the Arctic for 3 Weeks!</h1>
        <p>WASD - Move</p>
        <p>Mouse - Look around</p>
        <p>Space - Jump</p>
        <p>ESC - Pause</p>
        <p class="click-msg">Click to start</p>
    </div>
    <div id="crosshair"></div>
    <div id="day-display">Day 1 of 21</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    (function() {
        // ============================================================
        // SETUP
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xc8d8e8);
        scene.fog = new THREE.FogExp2(0xc8d8e8, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // LIGHTING
        // ============================================================
        const sunLight = new THREE.DirectionalLight(0xffeedd, 0.8);
        sunLight.position.set(100, 30, -50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x6688aa, 0.5);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x8899bb, 0xddeeff, 0.3);
        scene.add(hemiLight);

        // ============================================================
        // GROUND - Snowy terrain
        // ============================================================
        const groundSize = 2000;
        const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, 100, 100);
        const vertices = groundGeo.attributes.position.array;
        for (let i = 0; i < vertices.length; i += 3) {
            vertices[i + 2] = Math.random() * 0.3 +
                Math.sin(vertices[i] * 0.01) * 1.5 +
                Math.cos(vertices[i + 1] * 0.01) * 1.5;
        }
        groundGeo.computeVertexNormals();

        const groundMat = new THREE.MeshStandardMaterial({
            color: 0xeef2f5,
            roughness: 0.9,
            metalness: 0.0,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============================================================
        // WATER - Surrounds the snowy land at the edges
        // ============================================================
        const waterGeo = new THREE.PlaneGeometry(4000, 4000);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x1a3a4a,
            roughness: 0.2,
            metalness: 0.3,
            transparent: true,
            opacity: 0.85,
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.5; // Just below ground level
        scene.add(water);

        // The snow ground edge is at ~800 from center (groundSize/2 = 1000 but terrain is visible to ~800)
        const landRadius = 800;

        // ============================================================
        // SNOW PARTICLES
        // ============================================================
        const snowCount = 8000;
        const snowGeo = new THREE.BufferGeometry();
        const snowPositions = new Float32Array(snowCount * 3);
        const snowVelocities = new Float32Array(snowCount);
        const snowArea = 400;

        for (let i = 0; i < snowCount; i++) {
            snowPositions[i * 3] = (Math.random() - 0.5) * snowArea;
            snowPositions[i * 3 + 1] = Math.random() * 80;
            snowPositions[i * 3 + 2] = (Math.random() - 0.5) * snowArea;
            snowVelocities[i] = 0.5 + Math.random() * 1.5;
        }
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPositions, 3));

        const snowMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.3,
            transparent: true,
            opacity: 0.8,
            depthWrite: false,
        });
        const snow = new THREE.Points(snowGeo, snowMat);
        scene.add(snow);

        // ============================================================
        // ANIMAL BUILDERS - Blocky Minecraft-style animals
        // ============================================================

        function createPolarBear() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xf0ece0, roughness: 0.8 });
            const noseMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.4, 3.0), mat);
            body.position.y = 1.4;
            body.castShadow = true;
            group.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.0, 1.2), mat);
            head.position.set(0, 2.0, 1.8);
            head.castShadow = true;
            group.add(head);

            // Nose
            const nose = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.2), noseMat);
            nose.position.set(0, 1.85, 2.45);
            group.add(nose);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.1), eyeMat);
            eyeL.position.set(-0.3, 2.1, 2.41);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.1), eyeMat);
            eyeR.position.set(0.3, 2.1, 2.41);
            group.add(eyeR);

            // Ears
            const earL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.2), mat);
            earL.position.set(-0.45, 2.55, 1.8);
            group.add(earL);
            const earR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.2), mat);
            earR.position.set(0.45, 2.55, 1.8);
            group.add(earR);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.5, 0.7, 0.5);
            const fl = new THREE.Mesh(legGeo, mat); fl.position.set(-0.5, 0.35, 1.0); fl.castShadow = true; group.add(fl);
            const fr = new THREE.Mesh(legGeo, mat); fr.position.set(0.5, 0.35, 1.0); fr.castShadow = true; group.add(fr);
            const bl = new THREE.Mesh(legGeo, mat); bl.position.set(-0.5, 0.35, -1.0); bl.castShadow = true; group.add(bl);
            const br = new THREE.Mesh(legGeo, mat); br.position.set(0.5, 0.35, -1.0); br.castShadow = true; group.add(br);

            group.legs = [fl, fr, bl, br];
            return group;
        }

        function createSeal() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x778899, roughness: 0.7 });
            const bellyMat = new THREE.MeshStandardMaterial({ color: 0x99aabb, roughness: 0.7 });
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const noseMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

            // Body - elongated
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 2.0), mat);
            body.position.y = 0.4;
            body.castShadow = true;
            group.add(body);

            // Belly
            const belly = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 1.8), bellyMat);
            belly.position.y = 0.15;
            group.add(belly);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.55, 0.7), mat);
            head.position.set(0, 0.55, 1.2);
            head.castShadow = true;
            group.add(head);

            // Nose
            const nose = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.1), noseMat);
            nose.position.set(0, 0.45, 1.56);
            group.add(nose);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.05), eyeMat);
            eyeL.position.set(-0.2, 0.6, 1.56);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.05), eyeMat);
            eyeR.position.set(0.2, 0.6, 1.56);
            group.add(eyeR);

            // Flippers (front)
            const flipperGeo = new THREE.BoxGeometry(0.6, 0.1, 0.4);
            const flipL = new THREE.Mesh(flipperGeo, mat); flipL.position.set(-0.6, 0.2, 0.5); group.add(flipL);
            const flipR = new THREE.Mesh(flipperGeo, mat); flipR.position.set(0.6, 0.2, 0.5); group.add(flipR);

            // Tail flipper
            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.4), mat);
            tail.position.set(0, 0.2, -1.2);
            group.add(tail);

            return group;
        }

        function createBird() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.7 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x889999, roughness: 0.7 });
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xddaa33 });

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 0.7), mat);
            body.position.y = 0;
            body.castShadow = true;
            group.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat);
            head.position.set(0, 0.2, 0.45);
            group.add(head);

            // Beak
            const beak = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.2), beakMat);
            beak.position.set(0, 0.15, 0.7);
            group.add(beak);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.04), eyeMat);
            eyeL.position.set(-0.12, 0.25, 0.61);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.04), eyeMat);
            eyeR.position.set(0.12, 0.25, 0.61);
            group.add(eyeR);

            // Wings
            const wingGeo = new THREE.BoxGeometry(0.6, 0.08, 0.5);
            const wingL = new THREE.Mesh(wingGeo, wingMat); wingL.position.set(-0.45, 0.05, 0); group.add(wingL);
            const wingR = new THREE.Mesh(wingGeo, wingMat); wingR.position.set(0.45, 0.05, 0); group.add(wingR);

            // Tail
            const tail = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.3), wingMat);
            tail.position.set(0, 0.05, -0.45);
            group.add(tail);

            group.wingL = wingL;
            group.wingR = wingR;
            return group;
        }

        function createPenguin() {
            const group = new THREE.Group();
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.7 });
            const whiteMat = new THREE.MeshStandardMaterial({ color: 0xeeeef0, roughness: 0.7 });
            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xdd8833 });
            const feetMat = new THREE.MeshStandardMaterial({ color: 0xdd8833 });

            // Body (black back)
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.4), blackMat);
            body.position.y = 0.7;
            body.castShadow = true;
            group.add(body);

            // Belly (white front)
            const belly = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.6, 0.1), whiteMat);
            belly.position.set(0, 0.7, 0.2);
            group.add(belly);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 0.35), blackMat);
            head.position.set(0, 1.25, 0.0);
            head.castShadow = true;
            group.add(head);

            // White face patch
            const face = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), whiteMat);
            face.position.set(0, 1.2, 0.18);
            group.add(face);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), eyeMat);
            eyeL.position.set(-0.1, 1.28, 0.2);
            group.add(eyeL);
            const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), eyeMat);
            eyeR.position.set(0.1, 1.28, 0.2);
            group.add(eyeR);

            // Pupils
            const pupilL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.02), pupilMat);
            pupilL.position.set(-0.1, 1.28, 0.23);
            group.add(pupilL);
            const pupilR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.02), pupilMat);
            pupilR.position.set(0.1, 1.28, 0.23);
            group.add(pupilR);

            // Beak
            const beak = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.15), beakMat);
            beak.position.set(0, 1.18, 0.25);
            group.add(beak);

            // Wings/flippers
            const wingGeo = new THREE.BoxGeometry(0.12, 0.5, 0.25);
            const wingL = new THREE.Mesh(wingGeo, blackMat); wingL.position.set(-0.32, 0.7, 0); group.add(wingL);
            const wingR = new THREE.Mesh(wingGeo, blackMat); wingR.position.set(0.32, 0.7, 0); group.add(wingR);

            // Feet
            const footGeo = new THREE.BoxGeometry(0.18, 0.06, 0.25);
            const footL = new THREE.Mesh(footGeo, feetMat); footL.position.set(-0.12, 0.03, 0.1); group.add(footL);
            const footR = new THREE.Mesh(footGeo, feetMat); footR.position.set(0.12, 0.03, 0.1); group.add(footR);

            return group;
        }

        // ============================================================
        // SPAWN ANIMALS
        // ============================================================
        const animals = [];
        const animalCount = 45;

        // Helper: random position near the water edge (600-780 from center)
        function nearWaterPos() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 600 + Math.random() * 180;
            return new THREE.Vector3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
        }

        // Helper: random position on land (50-600 from center)
        function onLandPos() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 550;
            return new THREE.Vector3(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
        }

        // Spawn polar bears - near water
        for (let i = 0; i < animalCount; i++) {
            const bear = createPolarBear();
            const pos = nearWaterPos();
            bear.position.copy(pos);
            bear.rotation.y = Math.random() * Math.PI * 2;
            scene.add(bear);
            animals.push({
                mesh: bear,
                type: 'polarbear',
                hp: 1000,
                maxHp: 1000,
                speed: 3.5,
                targetPos: null,
                wanderTimer: 0,
                state: 'wander', // 'wander', 'chase', 'hunt_seal'
                attackCooldown: 0,
                legPhase: Math.random() * Math.PI * 2,
            });
        }

        // Spawn seals - near water
        for (let i = 0; i < animalCount; i++) {
            const seal = createSeal();
            const pos = nearWaterPos();
            seal.position.copy(pos);
            seal.rotation.y = Math.random() * Math.PI * 2;
            scene.add(seal);
            animals.push({
                mesh: seal,
                type: 'seal',
                hp: 500,
                maxHp: 500,
                speed: 1.2,
                targetPos: null,
                wanderTimer: 0,
                state: 'wander',
            });
        }

        // Spawn birds - anywhere, they fly
        for (let i = 0; i < animalCount; i++) {
            const bird = createBird();
            const pos = onLandPos();
            pos.y = 15 + Math.random() * 30; // Flying height
            bird.position.copy(pos);
            bird.rotation.y = Math.random() * Math.PI * 2;
            scene.add(bird);
            animals.push({
                mesh: bird,
                type: 'bird',
                hp: 100,
                maxHp: 100,
                speed: 8,
                targetPos: null,
                wanderTimer: 0,
                state: 'fly',
                flyHeight: 15 + Math.random() * 30,
                wingPhase: Math.random() * Math.PI * 2,
            });
        }

        // Spawn penguins - on land
        for (let i = 0; i < animalCount; i++) {
            const penguin = createPenguin();
            const pos = onLandPos();
            penguin.position.copy(pos);
            penguin.rotation.y = Math.random() * Math.PI * 2;
            scene.add(penguin);
            animals.push({
                mesh: penguin,
                type: 'penguin',
                hp: 6,
                maxHp: 6,
                speed: 1.5,
                targetPos: null,
                wanderTimer: 0,
                state: 'wander',
                waddle: 0,
            });
        }

        // ============================================================
        // ANIMAL AI
        // ============================================================
        const bearChaseRange = 40;
        const bearAttackRange = 3;
        const bearSealHuntRange = 50;
        let playerHp = 100;

        function updateAnimals(delta) {
            for (const animal of animals) {
                if (animal.hp <= 0) continue;

                const pos = animal.mesh.position;

                if (animal.type === 'polarbear') {
                    // Check distance to player
                    const distToPlayer = pos.distanceTo(camera.position);

                    // Check for nearby seals
                    let nearestSeal = null;
                    let nearestSealDist = bearSealHuntRange;
                    for (const other of animals) {
                        if (other.type === 'seal' && other.hp > 0) {
                            const d = pos.distanceTo(other.mesh.position);
                            if (d < nearestSealDist) {
                                nearestSealDist = d;
                                nearestSeal = other;
                            }
                        }
                    }

                    // Priority: chase player if close, else hunt seals, else wander
                    if (distToPlayer < bearChaseRange) {
                        animal.state = 'chase';
                        // Move toward player
                        const dir = new THREE.Vector3().subVectors(camera.position, pos).normalize();
                        dir.y = 0;
                        pos.x += dir.x * animal.speed * 1.5 * delta;
                        pos.z += dir.z * animal.speed * 1.5 * delta;
                        // Face player
                        animal.mesh.rotation.y = Math.atan2(dir.x, dir.z);

                        // Attack player
                        if (distToPlayer < bearAttackRange) {
                            animal.attackCooldown -= delta;
                            if (animal.attackCooldown <= 0) {
                                playerHp -= 4;
                                animal.attackCooldown = 1.0;
                                // Screen flash red on hit (handled in render)
                            }
                        }
                    } else if (nearestSeal) {
                        animal.state = 'hunt_seal';
                        const dir = new THREE.Vector3().subVectors(nearestSeal.mesh.position, pos).normalize();
                        dir.y = 0;
                        pos.x += dir.x * animal.speed * delta;
                        pos.z += dir.z * animal.speed * delta;
                        animal.mesh.rotation.y = Math.atan2(dir.x, dir.z);

                        // Kill seal if close
                        if (nearestSealDist < 3) {
                            nearestSeal.hp = 0;
                            nearestSeal.mesh.visible = false;
                        }
                    } else {
                        animal.state = 'wander';
                        wander(animal, delta, 500, 800);
                    }

                    // Animate legs
                    if (animal.state !== 'wander' || (animal.targetPos && pos.distanceTo(animal.targetPos) > 2)) {
                        animal.legPhase += delta * 6;
                        const legs = animal.mesh.legs;
                        if (legs) {
                            legs[0].position.y = 0.35 + Math.sin(animal.legPhase) * 0.15;
                            legs[1].position.y = 0.35 + Math.sin(animal.legPhase + Math.PI) * 0.15;
                            legs[2].position.y = 0.35 + Math.sin(animal.legPhase + Math.PI) * 0.15;
                            legs[3].position.y = 0.35 + Math.sin(animal.legPhase) * 0.15;
                        }
                    }

                } else if (animal.type === 'seal') {
                    wander(animal, delta, 550, 800);
                    // Slight body wobble
                    animal.mesh.rotation.z = Math.sin(Date.now() * 0.002 + animals.indexOf(animal)) * 0.05;

                } else if (animal.type === 'bird') {
                    // Fly in circles and occasionally change direction
                    animal.wanderTimer -= delta;
                    if (animal.wanderTimer <= 0 || !animal.targetPos) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 100 + Math.random() * 500;
                        animal.targetPos = new THREE.Vector3(
                            Math.cos(angle) * dist,
                            animal.flyHeight + (Math.random() - 0.5) * 10,
                            Math.sin(angle) * dist
                        );
                        animal.wanderTimer = 5 + Math.random() * 10;
                    }

                    const dir = new THREE.Vector3().subVectors(animal.targetPos, pos).normalize();
                    pos.x += dir.x * animal.speed * delta;
                    pos.y += (animal.targetPos.y - pos.y) * delta;
                    pos.z += dir.z * animal.speed * delta;
                    animal.mesh.rotation.y = Math.atan2(dir.x, dir.z);

                    // Wing flapping
                    animal.wingPhase += delta * 8;
                    if (animal.mesh.wingL) {
                        animal.mesh.wingL.rotation.z = Math.sin(animal.wingPhase) * 0.5;
                        animal.mesh.wingR.rotation.z = -Math.sin(animal.wingPhase) * 0.5;
                    }

                } else if (animal.type === 'penguin') {
                    wander(animal, delta, 0, 600);
                    // Waddle animation
                    animal.waddle += delta * 4;
                    animal.mesh.rotation.z = Math.sin(animal.waddle) * 0.1;
                }
            }
        }

        function wander(animal, delta, minDist, maxDist) {
            animal.wanderTimer -= delta;
            if (animal.wanderTimer <= 0 || !animal.targetPos) {
                const angle = Math.random() * Math.PI * 2;
                const dist = minDist + Math.random() * (maxDist - minDist);
                animal.targetPos = new THREE.Vector3(
                    Math.cos(angle) * dist,
                    animal.mesh.position.y,
                    Math.sin(angle) * dist
                );
                animal.wanderTimer = 3 + Math.random() * 8;
            }

            const dir = new THREE.Vector3().subVectors(animal.targetPos, animal.mesh.position);
            dir.y = 0;
            const dist = dir.length();
            if (dist > 1) {
                dir.normalize();
                animal.mesh.position.x += dir.x * animal.speed * delta;
                animal.mesh.position.z += dir.z * animal.speed * delta;
                animal.mesh.rotation.y = Math.atan2(dir.x, dir.z);
            } else {
                animal.wanderTimer = 0;
            }
        }

        // ============================================================
        // DAMAGE FLASH OVERLAY
        // ============================================================
        const damageOverlay = document.createElement('div');
        damageOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0);pointer-events:none;z-index:40;transition:background 0.1s;';
        document.body.appendChild(damageOverlay);
        let lastPlayerHp = playerHp;

        // ============================================================
        // PLAYER CONTROLS
        // ============================================================
        const blocker = document.getElementById('blocker');
        const crosshair = document.getElementById('crosshair');
        const dayDisplay = document.getElementById('day-display');
        let isLocked = false;

        const moveState = { forward: false, backward: false, left: false, right: false };
        let canJump = true;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        const PI_2 = Math.PI / 2;
        const moveSpeed = 60;
        const jumpForce = 8;
        const gravity = 20;
        const playerHeight = 1.7;

        document.addEventListener('click', function() {
            if (!isLocked) {
                renderer.domElement.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', function() {
            isLocked = document.pointerLockElement === renderer.domElement;
            if (isLocked) {
                blocker.style.display = 'none';
                crosshair.style.display = 'block';
                dayDisplay.style.display = 'block';
            } else {
                blocker.style.display = 'flex';
                crosshair.style.display = 'none';
            }
        });

        document.addEventListener('mousemove', function(e) {
            if (!isLocked) return;
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= e.movementX * 0.002;
            euler.x -= e.movementY * 0.002;
            euler.x = Math.max(-PI_2, Math.min(PI_2, euler.x));
            camera.quaternion.setFromEuler(euler);
        });

        document.addEventListener('keydown', function(e) {
            switch (e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'Space':
                    if (canJump) {
                        velocity.y = jumpForce;
                        canJump = false;
                    }
                    break;
            }
        });

        document.addEventListener('keyup', function(e) {
            switch (e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
            }
        });

        // ============================================================
        // WIND SOUND
        // ============================================================
        let audioCtx = null;
        let windStarted = false;

        function startWind() {
            if (windStarted) return;
            windStarted = true;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            const windNoise = audioCtx.createBufferSource();
            windNoise.buffer = noiseBuffer;
            windNoise.loop = true;

            const windFilter = audioCtx.createBiquadFilter();
            windFilter.type = 'lowpass';
            windFilter.frequency.value = 300;
            windFilter.Q.value = 0.5;

            const windFilter2 = audioCtx.createBiquadFilter();
            windFilter2.type = 'bandpass';
            windFilter2.frequency.value = 150;
            windFilter2.Q.value = 0.8;

            const windGain = audioCtx.createGain();
            windGain.gain.value = 0.15;

            windNoise.connect(windFilter);
            windFilter.connect(windFilter2);
            windFilter2.connect(windGain);
            windGain.connect(audioCtx.destination);
            windNoise.start();

            function modulateWind() {
                const now = audioCtx.currentTime;
                windFilter.frequency.setValueAtTime(windFilter.frequency.value, now);
                windFilter.frequency.linearRampToValueAtTime(
                    200 + Math.random() * 300,
                    now + 2 + Math.random() * 3
                );
                windGain.gain.setValueAtTime(windGain.gain.value, now);
                windGain.gain.linearRampToValueAtTime(
                    0.08 + Math.random() * 0.15,
                    now + 2 + Math.random() * 3
                );
                setTimeout(modulateWind, 3000 + Math.random() * 4000);
            }
            modulateWind();
        }

        document.addEventListener('click', startWind, { once: true });

        // ============================================================
        // FOOTSTEP SOUNDS
        // ============================================================
        let lastStepTime = 0;
        const stepInterval = 400;

        function playFootstep() {
            if (!audioCtx) return;
            const now = Date.now();
            if (now - lastStepTime < stepInterval) return;
            lastStepTime = now;

            const t = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                const env = Math.exp(-i / (bufferSize * 0.15));
                data[i] = (Math.random() * 2 - 1) * env;
            }

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 800 + Math.random() * 400;
            filter.Q.value = 0.5;

            const gain = audioCtx.createGain();
            gain.gain.value = 0.12 + Math.random() * 0.05;

            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            source.start(t);
        }

        // ============================================================
        // GAME LOOP
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);

            if (isLocked) {
                // Movement
                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize();

                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                velocity.x -= velocity.x * 8 * delta;
                velocity.z -= velocity.z * 8 * delta;

                velocity.x += (forward.x * direction.z + right.x * direction.x) * moveSpeed * delta;
                velocity.z += (forward.z * direction.z + right.z * direction.x) * moveSpeed * delta;

                velocity.y -= gravity * delta;

                camera.position.x += velocity.x * delta;
                camera.position.z += velocity.z * delta;
                camera.position.y += velocity.y * delta;

                if (camera.position.y < playerHeight) {
                    camera.position.y = playerHeight;
                    velocity.y = 0;
                    canJump = true;
                }

                const isMoving = direction.length() > 0;
                if (isMoving && canJump) {
                    playFootstep();
                }
            }

            // Update animals
            updateAnimals(delta);

            // Damage flash
            if (playerHp < lastPlayerHp) {
                damageOverlay.style.background = 'rgba(255, 0, 0, 0.4)';
                setTimeout(() => { damageOverlay.style.background = 'rgba(255, 0, 0, 0)'; }, 200);
            }
            lastPlayerHp = playerHp;

            // Update snow
            const snowPos = snow.geometry.attributes.position.array;
            for (let i = 0; i < snowCount; i++) {
                const idx = i * 3;
                snowPos[idx + 1] -= snowVelocities[i] * delta;
                snowPos[idx] += Math.sin(Date.now() * 0.001 + i) * 0.02;

                if (snowPos[idx + 1] < 0) {
                    snowPos[idx] = camera.position.x + (Math.random() - 0.5) * snowArea;
                    snowPos[idx + 1] = 50 + Math.random() * 30;
                    snowPos[idx + 2] = camera.position.z + (Math.random() - 0.5) * snowArea;
                }

                const dx = snowPos[idx] - camera.position.x;
                const dz = snowPos[idx + 2] - camera.position.z;
                if (Math.abs(dx) > snowArea / 2) {
                    snowPos[idx] = camera.position.x + (Math.random() - 0.5) * snowArea;
                }
                if (Math.abs(dz) > snowArea / 2) {
                    snowPos[idx + 2] = camera.position.z + (Math.random() - 0.5) * snowArea;
                }
            }
            snow.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    })();
    </script>
</body>
</html>
